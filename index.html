<!DOCTYPE html>
<html>
<head>
<title>Responsive Calculator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
}

body{
background:#f2f2f2;
font-family:Segoe UI, Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.calculator{
width:300px;
background:white;
border:1px solid #ccc;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
padding:10px;
}

#display{
width:100%;
height:60px;
font-size:24px;
text-align:right;
padding:10px;
border:none;
background:#e6e6e6;
margin-bottom:10px;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
}

button{
height:55px;
font-size:18px;
border:none;
background:#f7f7f7;
cursor:pointer;
}

button:hover{
background:#e0e0e0;
}

.operator{
background:#dcdcdc;
}

.equal{
background:#4CAF50;
color:white;
}

.equal:hover{
background:#43a047;
}

.zero{
grid-column:span 2;
}

.info{
background:#2196F3;
color:white;
}

/* TABLET */
@media (max-width:900px){

.calculator{
width:260px;
}

button{
height:50px;
font-size:17px;
}

#display{
font-size:22px;
}

}

/* MOBILE */
@media (max-width:600px){

.calculator{
width:95%;
max-width:320px;
}

button{
height:45px;
font-size:16px;
}

#display{
height:55px;
font-size:20px;
}

}

</style>
</head>

<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="clearDisplay()">C</button>
<button onclick="backspace()">⌫</button>
<button onclick="press('/')">÷</button>
<button onclick="press('*')">×</button>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('-')">−</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('+')">+</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="calculate()" class="equal">=</button>

<button onclick="press('0')" class="zero">0</button>
<button onclick="press('.')">.</button>

<button onclick="developer()" class="info">A</button>
<button onclick="appInfo()" class="info">B</button>

</div>

</div>

<script>

let display = document.getElementById("display");

function press(value){
display.value += value;
}

function clearDisplay(){
display.value="";
}

function backspace(){
display.value = display.value.slice(0,-1);
}

function calculate(){
try{
display.value = eval(display.value);
}
catch{
alert("Invalid Expression");
}
}

function developer(){
alert("Developer Information\n\nName: Vincent Ampong\nSchool: Northwestern Mindanao State College of Science and Technology");
}

function appInfo(){
alert("Application Information\n\nStandard Calculator Web App\nVersion 1.0");
}

/* KEYBOARD SUPPORT */

document.addEventListener("keydown", function(event){

let key = event.key;

if(!isNaN(key) || key === "."){
press(key);
}

if(key === "+" || key === "-" || key === "*" || key === "/"){
press(key);
}

if(key === "Enter"){
calculate();
}

if(key === "Backspace"){
backspace();
}

if(key === "Delete"){
clearDisplay();
}

});

</script>

</body>
</html>
