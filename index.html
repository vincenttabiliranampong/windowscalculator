<!DOCTYPE html>
<html>
<head>
<title>Standard Calculator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial;
background:#d9d9d9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
flex-direction:column;
}

.calculator{
background:#bfbfbf;
padding:15px;
border-radius:8px;
width:300px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

#display{
width:100%;
height:60px;
font-size:24px;
text-align:right;
padding:10px;
margin-bottom:10px;
border:none;
background:#eeeeee;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
}

button{
height:50px;
font-size:18px;
border:none;
background:#e6e6e6;
cursor:pointer;
}

button:hover{
background:#d0d0d0;
}

.operator{
background:#cccccc;
}

.equal{
background:#cccccc;
color:white;
grid-column:4;
}

.info{
background:#8c8c8c;
color:white;
}

.clear{
margin-top:10px;
width:100%;
height:50px;
font-size:18px;
background:#cccccc;
color:white;
border:none;
cursor:pointer;
}

/* Info display below calculator */

.info-display{
width:300px;
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:14px;
}

#devInfo{
text-align:left;
}

#appInfo{
text-align:right;
}

/* Responsive */

@media (max-width:600px){

.calculator{
width:95%;
}

.info-display{
width:95%;
}

button{
height:45px;
font-size:16px;
}

#display{
font-size:20px;
}

}

</style>
</head>

<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button class="operator" onclick="press('+')">+</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button class="operator" onclick="press('*')">*</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button class="operator" onclick="press('-')">-</button>

<button class="info" onclick="developer()">A</button>
<button onclick="press('0')">0</button>
<button class="info" onclick="appInfo()">B</button>
<button class="operator" onclick="press('/')">/</button>

<button class="equal" onclick="calculate()">=</button>

</div>

<button class="clear" onclick="clearDisplay()">Clear</button>

</div>

<!-- DISPLAY INFO BELOW CALCULATOR -->

<div class="info-display">
<div id="devInfo"></div>
<div id="appInfo"></div>
</div>

<script>

let display=document.getElementById("display");

function press(val){
display.value+=val;
}

// NEW calculate function: left-to-right, no MDAS
function calculate(){
try{
    let exp = display.value;
    if(!exp) return;

    // Split numbers and operators
    let numbers = exp.split(/[\+\-\*\/]/).map(Number);
    let operators = exp.split('').filter(c => '+-*/'.includes(c));

    let result = numbers[0];

    for(let i=0; i<operators.length; i++){
        let op = operators[i];
        let num = numbers[i+1];
        if(op === '+') result = result + num;
        else if(op === '-') result = result - num;
        else if(op === '*') result = result * num;
        else if(op === '/') result = result / num;
    }

    display.value = result;
}
catch{
    alert("Invalid Expression");
}
}

function clearDisplay(){
display.value="";
}

function developer(){
document.getElementById("devInfo").innerHTML=
"Developer: Vincent Ampong";
}

function appInfo(){
document.getElementById("appInfo").innerHTML=
"Standard Calculator v1.0";
}

document.addEventListener("keydown",function(e){

let key=e.key;

if(!isNaN(key) || key==="."){
press(key);
}

if(key==="+"||key==="-"||key==="*"||key==="/"){
press(key);
}

if(key==="Enter"){
calculate();
}

if(key==="Backspace"){
display.value=display.value.slice(0,-1);
}

if(key==="Delete"){
clearDisplay();
}

});

</script>

</body>
</html>
